<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AskAI Research</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <button id="star" class="star" title="Mark this page as relevant">☆</button>
    <span id="phase" class="badge">—</span>
  </header>
  <p id="status" class="status">Connecting to AskAI…</p>
  <section id="wait" class="wait" hidden>
    <span>Waiting for you — <b id="count">0</b> s</span>
    <button id="resolve" class="btn">✓ Solved</button>
  </section>
  <section id="controls" class="controls">
    <button id="pause" class="btn">⏸ Pause</button>
    <button id="next" class="btn" title="Skip the wait before the next page" hidden>⏭ Next</button>
    <button id="skip" class="btn danger">Skip ✕</button>
    <label class="delay">Delay <b id="delayval">0</b> s
      <input id="delay" type="range" min="0" max="30" step="1" value="0">
    </label>
  </section>
  <script src="panel.js"></script>
</body>
</html>
