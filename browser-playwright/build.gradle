// The Playwright browser backend of the research agent: the official Playwright Java API over playwright4j
// (the Playwright Core JS driver runs on GraalJS in a child JVM — no Node.js), the Camoufox distribution/
// launch code taken over from Argos, the single-owner BrowserSessionActor and the flat web_* tool set.
// Since the return to Java 21 this is a plain LIBRARY: the research plugin starts PlaywrightBrowserRuntime
// in-process. No sidecar JVM, no Solon MCP server, no readiness line, no parent-death watchdog.
//
// Classloading: the plugin bundles this module and its jars in its lib/ and PF4J loads them plugin-first, so
// the GraalVM 25 stack playwright4j needs never shares a classpath with the host's GraalJS 21.2 (mermaid-java,
// PAC evaluation). The driver child JVM takes its classpath from the plugin classloader's jar URLs.
apply plugin: 'java-library'

dependencies {
    implementation project(':browser-api')
    // The mechanical SERP analysis runs in-process for web_search_prepare (the browser measures AND asks
    // the analysis for judgement).
    implementation project(':browser-search-analysis')
    // The official Playwright Java API — but WITHOUT its Node driver artifacts: playwright4j ships a
    // replacement com.microsoft.playwright.impl.driver.Driver that spawns a second Java process running
    // the Playwright Core JS driver on GraalJS (no Node.js). Excluding upstream 'driver' is mandatory:
    // two Driver classes on one classpath would make the winner order-dependent.
    // Keep the API version aligned with the Playwright Core that playwright4j embeds (0.3.0 → 1.62.x).
    implementation('com.microsoft.playwright:playwright:1.62.0') {
        exclude group: 'com.microsoft.playwright', module: 'driver'
        exclude group: 'com.microsoft.playwright', module: 'driver-bundle'
    }
    // askai #31: the search browser hands its Browser to Serp4J PlaywrightSearchProviders (ADR-020).
    api "com.aresstack:serp4j-playwright:${(findProperty('serp4jVersion') ?: '0.1.0-SNAPSHOT')}"
    implementation 'com.aresstack:playwright4j:0.3.0' // embeds the Core JS package itself (no driver-bundle)
    // The Camoufox distribution/launch code (com.aresstack.askai.browser.playwright.camoufox) reads its manifest,
    // font groups and fingerprint profile with Gson, the house JSON library (ADR 0001, section 3.1); Playwright
    // needs Gson anyway, so the plugin lib/ carries no Jackson.
    implementation "com.google.code.gson:gson:${gsonVersion}"
    // PDF search hits: the browser's PDF viewer runs no page script, so the session reads the PDF itself
    // (PdfPageReader, PdfDocumentText — also the #39 import's extraction).
    implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"

    testImplementation 'junit:junit:4.13.2'
    // The Camoufox tests come over from Argos unchanged (JUnit 5); the vintage engine keeps the JUnit 4 tests.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
    // The live browser tests self-gate on the capability probe (Assume): without an installed browser they
    // SKIP with a readable message instead of silently passing or failing the build.
    // A failing live test prints its full exception (message, cause chain, stack) into the CI log, so a
    // one-off failure on a runner can be diagnosed without the HTML report.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showStackTraces true
    }
}
