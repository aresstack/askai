name: CI

# askai #52: every pull request runs the complete build with all tests on JDK 21.
# Live tests that need a real browser, a local model or provider credentials stay opt-in
# (system properties / environment variables) and are skipped here.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish Serp4J to mavenLocal (not on Maven Central yet, see docs/serp4j.md)
        run: bash scripts/install-serp4j.sh "${SERP4J_REF:-Develop}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with all tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --continue build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
