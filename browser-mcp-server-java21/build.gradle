// Java-21 Browser-MCP sidecar: the ONLY module that touches playwright4j (major 65). It runs as a separate
// process and serves the flat web_* tools over Solon MCP (streamable HTTP, loopback, token in path). The
// Java-8 host never compiles against it and never loads its classes — it only talks MCP to it. Not packed
// into the AskAI fat jar.
//
// The shared boundary is the Java-8-COMPILED :browser-api jar (Java 21 consumes Java 8 bytecode natively):
// same BrowserSession port and UrlSafetyPolicy binary the Java-8 host uses — no double compilation, no
// blurred module boundary, no duplicate classes in the sidecar jar.
apply plugin: 'application'

dependencies {
    implementation project(':browser-api')
    // Java-8 bytecode consumed by this Java-21 process: the mechanical SERP analysis runs
    // in-process for web_search (the sidecar measures AND asks the analysis for judgement).
    implementation project(':browser-search-analysis')
    // The official Playwright Java API — but WITHOUT its Node driver artifacts: playwright4j ships a
    // replacement com.microsoft.playwright.impl.driver.Driver that spawns a second Java process running
    // the Playwright Core JS driver on GraalJS (no Node.js). Excluding upstream 'driver' is mandatory:
    // two Driver classes on the fat-jar classpath would make the winner order-dependent.
    // Keep the API version aligned with the Playwright Core that playwright4j embeds (0.3.0 → 1.62.x).
    implementation('com.microsoft.playwright:playwright:1.62.0') {
        exclude group: 'com.microsoft.playwright', module: 'driver'
        exclude group: 'com.microsoft.playwright', module: 'driver-bundle'
    }
    implementation 'com.aresstack:playwright4j:0.3.0' // embeds the Core JS package itself (no driver-bundle)
    implementation 'org.noear:solon:3.10.1'
    implementation 'org.noear:solon-boot-jdkhttp:3.10.1'
    implementation 'org.noear:solon-ai-mcp:3.10.1'
    // Camoufox distribution/launch code taken over from Argos (com.aresstack.askai.browser.sidecar.camoufox)
    // reads its pins, manifest and fingerprint profile with Jackson, as in Argos.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation 'junit:junit:4.13.2'
    // The Camoufox tests come over from Argos unchanged (JUnit 5); the vintage engine keeps the JUnit 4 tests.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
    // The live browser test self-gates on the capability probe (Assume): without an installed
    // Chrome/Edge it SKIPS with a readable message instead of silently passing or failing the build.
}

application {
    mainClass = 'com.aresstack.askai.browser.sidecar.BrowserMcpSidecarMain'
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

// Runnable sidecar distribution: a THIN jar with a Class-Path manifest plus a lib/ directory next to it.
// A fat/uber jar is NOT viable here: repackaging GraalJS/Truffle loses the `Multi-Release: true` manifest
// attribute and collapses duplicate META-INF/services provider files, so Truffle fails at runtime with
// "Multi-Release classes are not configured correctly" (proven by the 36C live-sidecar test). The thin
// jar keeps every dependency jar intact; `java -jar` works, and the GraalDriverMain child spawned with
// `-cp <thin jar>` inherits the same dependencies through the jar's Class-Path mechanism.
task sidecarLibs(type: Sync) {
    group = 'build'
    description = 'Collects the sidecar runtime dependencies into build/sidecar/lib.'
    from configurations.runtimeClasspath.filter { it.name.endsWith('.jar') }
    into layout.buildDirectory.dir('sidecar/lib')
}

task sidecarJar(type: Jar) {
    group = 'build'
    description = 'Build the runnable Java-21 browser MCP sidecar jar (thin, with lib/ Class-Path).'
    archiveBaseName = 'browser-mcp-sidecar'
    destinationDirectory = layout.buildDirectory.dir('sidecar')
    dependsOn classes, sidecarLibs
    from sourceSets.main.output
    manifest {
        attributes('Main-Class': application.mainClass.get())
        attributes('Class-Path': configurations.runtimeClasspath
                .filter { it.name.endsWith('.jar') }
                .collect { 'lib/' + it.name }
                .join(' '))
    }
}
