// External Java-8 demo agent process: annotation-driven acp-sdk agent over STDIO. STDOUT carries ONLY ACP;
// logs go to STDERR. Proves the ACP boundary independently of the real research agent. Not in the fat jar.
apply plugin: 'application'
dependencies {
    implementation 'org.noear:acp-sdk:3.10.1'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17' // keep slf4j quiet; explicit logs go to STDERR ourselves
}
application {
    mainClass = 'com.aresstack.askai.acp.demo.DemoAcpAgentMain'
}
task demoAgentJar(type: Jar) {
    group = 'build'
    description = 'Runnable demo ACP agent jar (spawned by the adapter round-trip test).'
    archiveBaseName = 'acp-demo-agent'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn classes
    from sourceSets.main.output
    from { configurations.runtimeClasspath.filter { it.name.endsWith('.jar') }.collect { zipTree(it) } }
    manifest { attributes('Main-Class': application.mainClass.get()) }
}
