allprojects {
    group = 'com.aresstack.askai'
    version = (findProperty('releaseVersion') ?: '0.1.0').toString()

    repositories {
        // The win-directml-java model catalog + generation runtime are consumed from the PUBLISHED
        // Maven Central release (com.aresstack:*:0.2.1). No mavenLocal / SNAPSHOT — the build must
        // resolve reproducibly on a fresh machine.
        mavenCentral()
    }
}

// ONE Gson version for every module that declares Gson (ADR 0001, section 3.1). It is the version Playwright
// Java brings into the research plugin's lib/, so the plugin and the host resolve the same Gson.
ext.gsonVersion = '2.14.0'

subprojects {
    apply plugin: 'java'

    // ONE language level for the whole build: Java 21 (the return from the Java-8 line, 2026-10). Every
    // module — app, plugin, runtime and the former sidecars — is compiled, tested and run with a Java 21
    // toolchain, so Gradle uses a JDK 21 for compile/test/run even when the Gradle daemon itself runs on
    // an older JVM. The toolchain is found locally (IntelliJ ~/.jdks, JAVA_HOME, PATH, registry) or
    // auto-provisioned through the foojay resolver declared in settings.gradle.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// The third-party library list of Help > About (oss-licenses.json in askai-app's resources).
ext.ossLicenseTargetProjectPath = ':askai-app'
apply from: "$rootDir/gradle/oss-licenses.gradle"
