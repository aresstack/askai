allprojects {
    group = 'com.aresstack.askai'
    version = (findProperty('releaseVersion') ?: '0.1.0').toString()

    repositories {
        // The win-directml-java model catalog + generation runtime are consumed from the PUBLISHED
        // Maven Central release (com.aresstack:*:0.2.1). No mavenLocal / SNAPSHOT — the build must
        // resolve reproducibly on a fresh machine.
        mavenCentral()
        // Serp4J (WP5) is not on Maven Central yet. ONLY its artifacts (com.aresstack:serp4j-*) are read from
        // mavenLocal; everything else still resolves reproducibly from Central. Publish them first from a Serp4J
        // checkout (branch Develop): ./gradlew publishToMavenLocal  - see docs/serp4j.md.
        mavenLocal {
            content {
                includeModuleByRegex('com\\.aresstack', 'serp4j-.*')
            }
        }
    }
}

subprojects {
    apply plugin: 'java'

    // AskAI is a Java-21 application (Angelo 2026-11-02, askai #31): every module compiles for and runs on Java 21.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// The third-party library list of Help > About (oss-licenses.json in askai-app's resources).
ext.ossLicenseTargetProjectPath = ':askai-app'
apply from: "$rootDir/gradle/oss-licenses.gradle"
