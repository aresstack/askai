// External Solon research agent runtime (Java 21): a separate process speaking ACP to AskAI and MCP to the
// research-control (and later browser) endpoints. Solon/ACP/MCP types are allowed HERE; the UI plugin never
// sees them. Not part of the AskAI fat jar (no dependency from askai-app).
apply plugin: 'application'

dependencies {
    implementation 'org.noear:acp-sdk:3.10.1'
    implementation 'org.noear:solon-ai-mcp:3.10.1'
    // Public-suffix aware domain families (challenge locks, transit rules) — shared with the sidecar.
    implementation project(':browser-api')
    // The research DOMAIN CORE (pure Java 8, no dependencies): the runtime EXECUTES searches and produces
    // domain objects (SearchRun/SearchCandidate) that the host persists as project truth. Both sides must
    // speak the same model, or the wire between them degenerates into untyped strings again.
    implementation project(':research-domain')
    // A5: neutral reranker endpoint contract (descriptor + strict codec) published by the host.
    implementation project(':agent-model-runtime-api')
    // A4 transport: the layout-repair codec and the model-using repair coordinator (Java-8, model-free
    // analysis; the concrete StructuredInferencePort adapter is injected by the runtime).
    implementation project(':browser-search-analysis')
    // Slice 2: the async web-search-provider module (Brave/BrightData/DataForSEO over AsyncHttpClient),
    // consumed behind the existing SearchProvider seam via a thin adapter. File-based config + AES-GCM
    // secrets live in the module; the runtime never carries provider credentials.
    implementation project(':web-search-providers')
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'

    testImplementation project(':acp-client-api')
    testImplementation project(':acp-solon-client')
    testImplementation project(':mcp-runtime-api')
    testImplementation project(':mcp-solon-runtime')
    // 36C: the live-sidecar integration test drives the PRODUCTIVE capture/acceptance lifecycle
    // (CaptureStore, SourceAcceptanceService, in-memory repository/index) behind the research endpoint.
    testImplementation project(':research-agent-ui-plugin')
    // The plugin's shared APIs are compileOnly there (host-provided); the E2E host wiring test IS the host.
    testImplementation project(':agent-workspace-api')
    testImplementation project(':agent-plugin-pf4j-api')
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.aresstack.askai.research.runtime.ResearchAgentMain'
}

task researchAgentJar(type: Jar) {
    group = 'build'
    description = 'Runnable external research agent jar (spawned by AskAI / the round-trip test).'
    archiveBaseName = 'research-agent-runtime'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn classes
    // Ensure every runtime dependency jar (including sibling project jars like :web-search-providers) is
    // actually built before this fat jar tries to expand it — the lazy from{} closure does not infer it.
    dependsOn configurations.runtimeClasspath
    from sourceSets.main.output
    from { configurations.runtimeClasspath.filter { it.name.endsWith('.jar') }.collect { zipTree(it) } }
    manifest { attributes('Main-Class': application.mainClass.get()) }
}

test {
    useJUnit()
    dependsOn researchAgentJar
    // 36C: the loop-vs-live-Playwright test spawns the REAL Java-21 sidecar fat jar as a separate
    // process (the Java-8 test JVM never loads sidecar classes). Without a Java-21 toolchain or an
    // installed browser the test SKIPS readably; the build stays green.
    dependsOn ':browser-mcp-server-java21:sidecarJar'
    // A5 R0 proof: the reranker live test spawns the REAL Java-21 local-model runtime jar (backend=cpu)
    // and calls /api/rerank against the installed cross-encoder. It SKIPS readably without a Java-21
    // toolchain, the staged jar, or an installed reranker model; the build stays green either way.
    dependsOn ':local-model-runtime-sidecar-java21:sidecarJar'
    doFirst {
        // Scope live-gate model override: -Daskai.live.main.model=gemma4:e2b runs the generator/
        // sweep gates against a SPECIFIC installed model instead of the first chat model found.
        if (System.getProperty('askai.live.main.model') != null) {
            systemProperty 'askai.live.main.model', System.getProperty('askai.live.main.model')
        }
        if (System.getProperty('askai.live.probe.target') != null) {
            systemProperty 'askai.live.probe.target', System.getProperty('askai.live.probe.target')
        }
        systemProperty 'research.agent.jar', researchAgentJar.archiveFile.get().asFile.absolutePath
        // The spawned agent runs on the test JVM's own JDK (the Java 21 toolchain): the tests fall back to
        // their java.home, so no daemon-JVM path (possibly an older Java) is handed down any more.
        def sidecarTask = project(':browser-mcp-server-java21').tasks.getByName('sidecarJar')
        systemProperty 'browser.sidecar.jar', sidecarTask.archiveFile.get().asFile.absolutePath
        def localModelJar = project(':local-model-runtime-sidecar-java21').tasks.getByName('sidecarJar')
        systemProperty 'localmodel.sidecar.jar', localModelJar.archiveFile.get().asFile.absolutePath
        try {
            def launcher21 = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }.get()
            systemProperty 'sidecar.java', launcher21.executablePath.asFile.absolutePath
        } catch (Exception noJava21) {
            // property absent → the sidecar test skips with a readable message
        }
    }
}
