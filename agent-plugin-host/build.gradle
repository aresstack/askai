apply plugin: 'java-library'

// The PF4J-backed plugin host: catalog, compatibility checks, workspace lifecycle, generic workspace host,
// mode selector, plugin state/error handling. Contains NO research-specific classes.
dependencies {
    api project(':agent-workspace-api')
    api project(':agent-plugin-pf4j-api')
    implementation 'org.pf4j:pf4j:3.15.0'

    testImplementation 'junit:junit:4.13.2'
    // The classloader integration test loads the research plugin, which references host-provided
    // agent-model-runtime-api types (reranker/inference snapshot providers, the active-session registry) as
    // compileOnly — so the test HOST classpath must provide them, exactly as the real host (askai-app) does.
    testImplementation project(':agent-model-runtime-api')
    // Same rule for the comic-controls design system: the plugin's views use it compileOnly (it is
    // host-provided and excluded from the plugin's lib/), so the test HOST must provide it like askai-app.
    testRuntimeOnly project(':comic-controls')
    // And for the neutral MCP/ACP ports: the research plugin's in-JVM agent runtime uses them; askai-app
    // provides them on the host classpath and the plugin excludes them from its lib/.
    testRuntimeOnly project(':mcp-runtime-api')
    testRuntimeOnly project(':acp-client-api')
}

test {
    useJUnit()
    // The classloader integration test must load the research plugin from a real PF4J plugin DIRECTORY
    // (classes/ + lib/), NOT from the test classpath. We hand it the freshly built plugin distribution
    // directory via a system property; the plugin is deliberately NOT a dependency of this module.
    dependsOn ':research-agent-ui-plugin:pluginDistribution'
    doFirst {
        def distTask = project(':research-agent-ui-plugin').tasks.getByName('pluginDistribution')
        systemProperty 'research.plugin.dir', distTask.destinationDir.absolutePath
    }
}
