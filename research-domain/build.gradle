// The research methodology DOMAIN CORE: business objects, stable ids, revisions, approval baselines and
// the no-delete invariants. Pure Java 8 — deliberately NO Swing, ACP, MCP, Solon, Ollama, DirectML,
// OpenNLP, Lucene or HTTP dependency. Every port and adapter aligns to THIS model, never the reverse.
apply plugin: 'java-library'

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    doFirst {
        // askai.live.* switches (e.g. -Daskai.live.embed.model) live in the GRADLE JVM; forward them.
        System.properties.each { key, value ->
            if (key.toString().startsWith('askai.live.')) {
                systemProperty key.toString(), value.toString()
            }
        }
    }
}
