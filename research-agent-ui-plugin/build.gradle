// External PF4J plugin: research workspace clickdummy (domain + state machine + UI + fake backend).
// It is NOT on askai-app's classpath and NOT packed into the AskAI fat jar — it is built as a separate
// plugin artifact and loaded from a plugin directory.
//
// The shared APIs and PF4J are provided by the HOST classloader, so they are `compileOnly` here and must
// not be bundled into the plugin jar (that would break extension class identity across classloaders).
dependencies {
    // The typed legacy-browser-search settings domain (Java 8, framework-free). The HOST does not
    // provide browser-api, so it is a real implementation dependency and its classes+resources are
    // bundled INTO the plugin jar below (no other classloader in the host loads them — no identity
    // split).
    implementation project(':browser-api')
    // The IN-PROCESS Playwright browser (playwright4j GraalJS driver, Camoufox, the web_* tool set): the
    // plugin starts it on the first browser command. Its jars (Playwright, playwright4j, the GraalVM 25
    // stack, Gson) ship in this plugin's lib/ and load plugin-first, so they never meet the host's
    // GraalJS 21.2 on one classpath; the driver child JVM takes its classpath from these jar URLs.
    implementation project(':browser-playwright')
    // The research agent itself (ResearchAgentSession, the loop, the search strategies): since the return to
    // Java 21 it runs IN-PROCESS inside this plugin instead of as an ACP child process. Its jar ships in
    // this plugin's lib/; the host-provided APIs it compiles against (agent-model-runtime-api,
    // mcp-runtime-api) stay excluded from lib/ below.
    implementation project(':research-agent-runtime')
    // Central OAuth (AP 6): offline JWT validation of centrally issued access tokens.
    implementation 'com.aresstack:anauthentia:0.1.0'
    implementation 'com.aresstack:anauthentia-jwt:0.1.0'
    implementation 'org.jsoup:jsoup:1.17.2'   // #39: structural HTML import extraction (Java 8 bytecode)
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'   // #39: PDF text extraction (2.0.x = Java 8 line)
    // The knowledge-processing application layer (persistent FIFO + worker + scheduler) and, transitively,
    // :research-knowledge-pipeline + :research-domain. The plugin holds ONLY the neutral scheduler port + the
    // VisitedCapture→SourceCapture adapter; all queue/worker/NLP/embedding logic lives in these modules.
    implementation project(':research-knowledge-processing')
    // The productive knowledge worker runs HOST-SIDE in this plugin: the OpenNLP sentence resolver and the
    // Lucene-backed SemanticKnowledgeIndex. Their jars (opennlp-tools, lucene-*) ship in the plugin lib/ and
    // load via the plugin classloader; the neutral ports keep OpenNLP/Lucene types out of the domain/UI.
    implementation project(':research-text-opennlp')
    implementation project(':research-knowledge-lucene')
    // The async web-search-provider module (Brave/BrightData/DataForSEO over AsyncHttpClient) powers the
    // provider settings UI + host-side connection test. It and its transitive deps (AsyncHttpClient, Gson,
    // Netty) are NOT bundled into a fat jar — they ship in the plugin's lib/ directory (see pluginDistribution
    // below) and load via the plugin classloader. The runtime process keeps its own separate copy.
    implementation project(':web-search-providers')
    // The comic visual foundation (issue #36 line) is HOST-provided like the shared APIs: askai-app
    // has it on the application classpath, so the plugin compiles against it and PF4J delegates the
    // classes to the host at runtime — ONE copy, one uniform look, no identity split.
    compileOnly project(':comic-controls')
    // Mermaid rendering/validation (mindmap overlay + visualizer retry): HOST-provided the same way
    // — askai-app ships mermaid-java; the plugin never bundles the GraalJS stack.
    compileOnly 'com.aresstack:mermaid-java:0.2.0-beta.2'
    compileOnly project(':agent-workspace-api')
    compileOnly project(':agent-plugin-pf4j-api')
    compileOnly project(':mcp-runtime-api')      // host-provided, like the other shared APIs
    // Neutral reranker host port (RerankerConfigurationSnapshotProvider + DTOs). Host-provided at
    // runtime by askai-app; the plugin never depends on askai-app or LocalModelRuntimeManager.
    compileOnly project(':agent-model-runtime-api')
    compileOnly 'org.pf4j:pf4j:3.15.0'
    // Generates META-INF/extensions.idx from @Extension so PF4J can discover the extension.
    annotationProcessor 'org.pf4j:pf4j:3.15.0'

    testImplementation project(':comic-controls')
    testImplementation project(':agent-workspace-api')
    testImplementation project(':agent-plugin-pf4j-api')
    testImplementation project(':mcp-runtime-api')
    testImplementation project(':agent-model-runtime-api')
    testImplementation 'org.pf4j:pf4j:3.15.0'
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}

// ---------------------------------------------------------------------------------------------------------
// Commit 9: real PF4J plugin artifact + dev-install plumbing.
//
// The plugin JAR carries ONLY this module's own classes plus the generated META-INF/extensions.idx. The
// shared APIs (agent-workspace-api, agent-plugin-pf4j-api) and PF4J are `compileOnly` above, so they are not
// on this module's output and never enter the plugin JAR — they must come from the HOST classloader, or the
// extension interface would have a second, incompatible identity across classloaders.
// ---------------------------------------------------------------------------------------------------------

ext.researchPluginId = 'com.aresstack.askai.research'
ext.researchPluginClass = 'com.aresstack.askai.research.plugin.ResearchPlugin'
// PF4J DIRECTORY-layout plugin: <plugin>/classes (this module's classes + the PF4J descriptor manifest +
// generated extensions.idx) and <plugin>/lib/*.jar (ALL runtime dependencies — browser-api,
// web-search-providers and the AsyncHttpClient/Netty/Gson transitives). No shading, no class copying, no
// Netty relocation: the plugin classloader loads the lib/ jars as-is. The runtime process keeps its own
// separate copy of these libraries — nothing is shared across the process boundary.
ext.researchPluginDirName = 'research-agent-ui-plugin'

// PF4J reads a directory plugin's descriptor from <plugin>/classes/META-INF/MANIFEST.MF.
def pluginManifestFile = layout.buildDirectory.file('plugin-manifest/MANIFEST.MF')
task pluginManifest {
    group = 'build'
    description = 'Generate the PF4J plugin descriptor manifest.'
    outputs.file(pluginManifestFile)
    doLast {
        def file = pluginManifestFile.get().asFile
        file.parentFile.mkdirs()
        file.text = [
                'Manifest-Version: 1.0',
                "Plugin-Id: ${researchPluginId}",
                "Plugin-Class: ${researchPluginClass}",
                "Plugin-Version: ${project.version}",
                'Plugin-Provider: AresStack',
                'Plugin-Description: AskAI Research Agent',
                ''
                // Plugin-Requires deliberately omitted: compatibility is gated by the descriptor's
                // pluginApiVersion instead.
        ].join('\r\n')
    }
}

task pluginDistribution(type: Sync) {
    group = 'build'
    description = 'Assemble the external PF4J plugin as a directory layout (classes/ + lib/).'
    dependsOn classes, pluginManifest
    into layout.buildDirectory.dir("plugin-dist/${researchPluginDirName}")
    into('classes') {
        from sourceSets.main.output // plugin classes + resources incl. the generated META-INF/extensions.idx
    }
    into('classes/META-INF') {
        from pluginManifestFile
        rename { 'MANIFEST.MF' }
    }
    into('lib') {
        from configurations.runtimeClasspath // browser-api + web-search-providers + gson + AHC + netty + …
        // HOST-PROVIDED shared APIs must NEVER be bundled: their class/service identity has to come from the
        // HOST classloader, otherwise AgentHostContext.getService(<neutral SPI>.class) fails across classloaders
        // (a duplicated agent-model-runtime-api leaked in transitively via :research-knowledge-processing's
        // `api` dependency and broke the reranker/embedding/nlp/inference lookups). These jars are compileOnly
        // above; keep them out of lib/ so PF4J delegates them to the host.
        exclude 'agent-model-runtime-api*.jar'
        exclude 'mcp-runtime-api*.jar'
        exclude 'agent-workspace-api*.jar'
        exclude 'agent-plugin-pf4j-api*.jar'
        exclude 'comic-controls*.jar' // host-provided visual foundation — same rule as the APIs
    }
    // Regression guard: fail the build if any host-provided shared API slipped into the plugin's lib/.
    doLast {
        def libDir = layout.buildDirectory.dir("plugin-dist/${researchPluginDirName}/lib").get().asFile
        def forbidden = ['agent-model-runtime-api', 'mcp-runtime-api',
                         'agent-workspace-api', 'agent-plugin-pf4j-api', 'comic-controls']
        def leaked = (libDir.listFiles() ?: []).findAll { file ->
            forbidden.any { file.name.startsWith(it) }
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("Host-provided shared API jars must not be bundled into the research "
                    + "plugin (class-identity split breaks getService lookups): " + leaked*.name)
        }
    }
}

task installDevPlugin(type: Sync) {
    group = 'application'
    description = 'Install the research plugin DIRECTORY into the shared dev-plugins dir (leaves other plugins).'
    dependsOn pluginDistribution
    into rootProject.layout.buildDirectory.dir("dev-plugins/${researchPluginDirName}")
    from layout.buildDirectory.dir("plugin-dist/${researchPluginDirName}")
    doFirst {
        // Remove any stale SINGLE-JAR install of THIS plugin so PF4J never sees two copies of the same id.
        rootProject.layout.buildDirectory.file('dev-plugins/research-agent-ui-plugin.jar')
                .get().asFile.delete()
    }
}
