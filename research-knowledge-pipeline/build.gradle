// The research METHOD as a pipeline over neutral ports (sentence segmentation, embeddings): captures →
// sentences → semantic passages → topic clusters → concept/outline proposals → gap analysis. Depends on
// the domain core ONLY; concrete NLP/embedding/store adapters live in their own modules.
apply plugin: 'java-library'

dependencies {
    api project(':research-domain')
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit {
        excludeCategories 'com.aresstack.askai.research.knowledge.SlowTests'
    }
}

// PR 20: the slow clustering benchmark (6,000 vectors of 768 dimensions under 60 s); not part of `check`.
tasks.register('slowTest', Test) {
    description = 'Runs the slow-tagged tests of the research pipeline.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit {
        includeCategories 'com.aresstack.askai.research.knowledge.SlowTests'
    }
    maxHeapSize = '1g'
    testLogging { showStandardStreams = true }
}
