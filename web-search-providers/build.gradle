// Isolated async web-search-provider module (Brave / Bright Data / DataForSEO) imported as a real
// AskAI subproject. Group, version, Java 8 source/target, UTF-8 encoding and the mavenCentral repository
// are inherited from the root build; only java-library (for the exported Gson API) and the module's own
// dependencies are declared here. This slice is the isolated import only — no productive provider switch.
apply plugin: 'java-library'

dependencies {
    api "com.google.code.gson:gson:${gsonVersion}"
    implementation 'org.asynchttpclient:async-http-client:2.16.0'

    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}
