# AskAI's preferred models on an OpenAI-compatible API, used while nothing is chosen (like Space Harvester's
# setup-models.properties). The wizard and the settings preselect: exactly this id, else the one offered model whose
# id contains the part after the last "/", else the first offered model. At run time a role without a chosen model
# calls exactly this id. Chosen for the API's 14 models (2026-11-22).
#
# chat: the chat window and the research's default slot. gemma-4-31B-it is the API's member of the Gemma 4 family
# AskAI's research prompts were tuned with (gemma4:12b locally); openai/gpt-oss-120b is the larger alternative.
chat=google/gemma-4-31B-it
# embedding: bge-m3 is AskAI's calibrated embedding model (topic analysis, writer packs, scope fence); the API offers
# it as BAAI/bge-m3. Its vectors are a new vector world, so a stock embedded with Ollama is embedded again.
embedding=BAAI/bge-m3
rerank=nvidia/llama-nemotron-rerank-1b-v2
vision=google/gemma-4-31B-it
