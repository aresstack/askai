apply plugin: 'application'

dependencies {
    implementation project(':ollama4j-java8')
    // Comic UI foundation (issue #36): neutral Java-8 Swing controls — hover menus, comic split
    // pane, shared palette/painters. Deliberately free of AskAI/Research/PF4J types.
    implementation project(':comic-controls')
    // Video recording: JCodec is the PORTABLE default backend (pure Java, no native deps, works without
    // VLC/FFmpeg installed). VLC/FFmpeg are optional providers detected at runtime, never bundled.
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    // VLC backend: vlcj is only the Java BINDING (pure Java + JNA, same line as the WD4J/corenth
    // reference) — AskAI still ships no VLC; the backend is available only when the user has VLC
    // installed themselves.
    implementation 'uk.co.caprica:vlcj:3.12.1'
    // FFmpeg backend: compiled against JavaCV, but the jars (incl. ~100+ MB natives) are NEVER shipped
    // or fetched silently — FfmpegRuntimeLoader downloads them from Maven Central ONLY after the user's
    // explicit, confirmed request (reference: WD4J/corenth VideoRuntimeLoader), then attaches them in a
    // dedicated backend classloader. compileOnly keeps them out of the fat jar.
    compileOnly 'org.bytedeco:javacv:1.5.10'
    compileOnly 'org.bytedeco:javacpp:1.5.10'
    compileOnly 'org.bytedeco:ffmpeg:6.1.1-1.5.10'
    // Neutral win-directml model catalog (no DirectML runtime classes leak into the host): the
    // single source of truth for locally runnable model families (capabilities, download manifests,
    // runtime family, backends). Pinned to the published Maven Central release.
    implementation 'com.aresstack:directml-model-catalog:0.2.1'
    // OpenNLP for the chat-text analysis service (language detection + sentence split of
    // read-aloud text); the models come from the dedicated NLP store (Models > Setup > NLP).
    // Sentence splitting is SHARED with the source-review knowledge pipeline: the canonical
    // SentenceSegmentationPort/OpenNlpSentenceSegmenter — never a second implementation.
    implementation 'org.apache.opennlp:opennlp-tools:1.9.4'
    implementation project(':research-text-opennlp')
    // A5b: neutral reranker endpoint contract (DTO/codec only) shared with the research agent.
    implementation project(':agent-model-runtime-api')
    implementation project(':group-chat-api')
    implementation project(':group-chat-jgroups')
    implementation project(':audio-dsp')
    implementation project(':audio-openal')
    // PF4J workspace-plugin host (brings agent-workspace-api + agent-plugin-pf4j-api + pf4j transitively).
    // The research plugin is NOT a dependency and never enters the fat jar.
    implementation project(':agent-plugin-host')
    // Host runtime services for the PRODUCTIVE research mode (Commit 40): the host is the intended owner
    // of the Solon MCP server runtime and the ACP connector; plugins reach them only through the neutral
    // AgentHostContext.getService lookup. Research classes themselves stay out of the fat jar.
    implementation project(':mcp-runtime-api')
    implementation project(':mcp-solon-runtime')
    implementation project(':acp-client-api')
    implementation project(':acp-solon-client')
    implementation 'com.aresstack:win-proxy-java:0.1.0-beta.4'
    // HTML parsing for the Ollama Library scraper (Jerry/Lagarto). Java 8 bytecode, pulls
    // jodd-core transitively; only used to parse ollama.com HTML, the HTTP fetch goes through
    // the app's own proxy/TLS plumbing.
    implementation 'org.jodd:jodd-lagarto:6.0.6'
    // JSON for versioned audio-profile import/export (Slice 3). Gson is Java 8 compatible; do not
    // introduce Jackson in parallel.
    implementation 'com.google.code.gson:gson:2.10.1'

    // Decode audio formats accepted by file transcription. vorbis/flac/aac are discovered via Java Sound
    // SPI (META-INF/services, kept in the fat jar by mergeServiceFiles below), so they stay runtime-only.
    // MP3 is compiled against directly: the mp3spi conversion stream yields 0 PCM bytes for some
    // ffmpeg/Lavf MP3s (e.g. Common Voice), so Mp3AudioFileDecoder uses the JLayer core in this jar.
    implementation 'com.tianscar.javasound:javasound-mp3:1.9.7'
    runtimeOnly 'com.tianscar.javasound:javasound-vorbis:2.1.0'
    runtimeOnly 'com.tianscar.javasound:javasound-flac:1.4.1'
    runtimeOnly 'com.tianscar.javasound:javasound-aac:0.9.8'

    // Markdown parsing — pinned to the 0.62.x line (0.64.x changes the API; no Java-level reason any more).
    // Only the extensions actually used are added, not flexmark-all.
    implementation 'com.vladsch.flexmark:flexmark:0.62.2'
    implementation 'com.vladsch.flexmark:flexmark-ext-autolink:0.62.2'
    implementation 'com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:0.62.2'
    implementation 'com.vladsch.flexmark:flexmark-ext-tables:0.62.2'
    // Mermaid rendered to a BufferedImage via GraalJS + Batik (no WebView / CDN / external process).
    implementation 'com.aresstack:mermaid-java:0.2.0-beta.2'

    // Silence the "no SLF4J providers" startup warning Jodd's slf4j-api dependency prints.
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
    testImplementation 'junit:junit:4.13.2'
    // TEST-ONLY: full GUI-chain reproduction (plugin factory on the APP classpath); the plugin
    // never becomes a runtime dependency and never enters the fat jar (verifyFatJarExclusions).
    testImplementation project(':research-agent-ui-plugin')
}

test {
    useJUnit()
    // App-classpath reproduction of the research-agent start (diagnoses -32603 from the GUI).
    dependsOn ':research-agent-runtime:researchAgentJar'
    dependsOn ':browser-mcp-server-java21:sidecarJar'
    // A5: the GUI-chain reproduction needs the MANDATORY local reranker runtime jar staged so the real
    // LocalModelRuntimeManager can start it (skips readably when no cross-encoder model is installed).
    dependsOn ':local-model-runtime-sidecar-java21:sidecarJar', ':local-model-runtime-sidecar-java21:sidecarLibs'
    // C2c: the opt-in real-model smoke drives the productive LocalModelRuntimeManager, which needs the
    // assembled local-runtime distribution (thin jar + lib/) and a Java-21 launcher. Gated by
    // -Daskai.local.realModelSmoke=true, so a normal build only stages the dist, never downloads models.
    dependsOn 'localRuntimeDist'
    doFirst {
        def agentJarTask = project(':research-agent-runtime').tasks.getByName('researchAgentJar')
        systemProperty 'research.agent.jar', agentJarTask.archiveFile.get().asFile.absolutePath
        def sidecarTask = project(':browser-mcp-server-java21').tasks.getByName('sidecarJar')
        systemProperty 'browser.sidecar.jar', sidecarTask.archiveFile.get().asFile.absolutePath
        def localModelJar = project(':local-model-runtime-sidecar-java21').tasks.getByName('sidecarJar')
        systemProperty 'localmodel.sidecar.jar', localModelJar.archiveFile.get().asFile.absolutePath
        def localModelLibs = project(':local-model-runtime-sidecar-java21').tasks.getByName('sidecarLibs')
        systemProperty 'localmodel.sidecar.libs', localModelLibs.destinationDir.absolutePath
        systemProperty 'askai.local.runtime.dir',
                rootProject.layout.buildDirectory.dir('local-runtime').get().asFile.absolutePath
        // Forward the opt-in real-model-smoke flag from the Gradle CLI to the forked test JVM.
        systemProperty 'askai.local.realModelSmoke',
                System.getProperty('askai.local.realModelSmoke', 'false')
        // The whole build runs on the Java 21 toolchain: the sidecar launcher is that toolchain's java.
        def launcher21 = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get()
        systemProperty 'sidecar.java', launcher21.executablePath.asFile.absolutePath
        systemProperty 'askai.local.runtime.java', launcher21.executablePath.asFile.absolutePath
    }
}

application {
    mainClass = 'com.aresstack.askai.java8.AskAiJava8App'
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

// GraalVM js and regex both ship a file at
// META-INF/services/com.oracle.truffle.api.TruffleLanguage$Provider. A plain fat jar
// with DuplicatesStrategy.EXCLUDE keeps only the first one, dropping either the JS or the
// regex language registration. The PAC engine then fails with "pac-evaluation-failed"
// (Context.newBuilder("js") throws "language 'js' not installed" or the PAC script fails
// on shExpMatch with "language 'regex' not found"). Concatenate every META-INF/services
// file so all providers survive in the runnable jar.
def mergedServicesDir = layout.buildDirectory.dir('mergedServices')

task mergeServiceFiles {
    description = 'Concatenate META-INF/services descriptors so GraalVM language providers survive the fat jar.'
    dependsOn ':ollama4j-java8:jar'
    dependsOn ':group-chat-api:jar'
    dependsOn ':group-chat-jgroups:jar'
    dependsOn ':audio-dsp:jar'
    dependsOn ':audio-openal:jar'
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(mergedServicesDir)

    doLast {
        def outputDir = mergedServicesDir.get().asFile
        delete outputDir
        def merged = new LinkedHashMap<String, LinkedHashSet<String>>()
        configurations.runtimeClasspath.each { file ->
            if (!file.isFile() || !file.name.endsWith('.jar')) {
                return
            }
            def zip = new java.util.zip.ZipFile(file)
            try {
                zip.entries().each { entry ->
                    if (entry.directory || !entry.name.startsWith('META-INF/services/')) {
                        return
                    }
                    def lines = merged.get(entry.name)
                    if (lines == null) {
                        lines = new LinkedHashSet<String>()
                        merged.put(entry.name, lines)
                    }
                    zip.getInputStream(entry).withReader('UTF-8') { reader ->
                        reader.eachLine { line ->
                            def trimmed = line.trim()
                            if (trimmed.length() > 0 && !trimmed.startsWith('#')) {
                                lines.add(trimmed)
                            }
                        }
                    }
                }
            } finally {
                zip.close()
            }
        }
        merged.each { name, lines ->
            def target = new File(outputDir, name)
            target.parentFile.mkdirs()
            target.setText(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}

task fatJar(type: Jar) {
    group = 'build'
    description = 'Build the runnable AskAI fat jar (app + runtime dependencies; plugins and sidecar distributions stay outside).'
    archiveBaseName = 'askai'
    archiveClassifier = ''
    archiveVersion = project.version.toString()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn classes
    dependsOn ':ollama4j-java8:jar'
    dependsOn ':group-chat-api:jar'
    dependsOn ':group-chat-jgroups:jar'
    dependsOn ':audio-dsp:jar'
    dependsOn ':audio-openal:jar'
    dependsOn mergeServiceFiles

    // Added first so the concatenated service descriptors win over the per-jar copies
    // that DuplicatesStrategy.EXCLUDE would otherwise keep.
    from mergedServicesDir
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

build.dependsOn fatJar

// ---------------------------------------------------------------------------------------------------------
// Commit 9: run AskAI with the research plugin installed into the shared dev-plugins dir, and prove the
// research plugin never leaks into the fat jar.
// ---------------------------------------------------------------------------------------------------------

def devPluginsDir = rootProject.layout.buildDirectory.dir('dev-plugins')

// Immutable per-run plugin generations (D1). Each runWithDevPlugins invocation stages the assembled
// plugin distribution into its OWN generation directory under here, so a later Gradle build (which
// produces a NEW generation) can never overwrite the .class files an already-running JVM will still
// load lazily via PF4J — the root cause of the random ClassFormatError ($2 / $7) failures.
def devPluginRunsDir = rootProject.layout.buildDirectory.dir('dev-plugin-runs')

// One assembled research runtime distribution (Commit 42): agent jar + sidecar thin jar + its lib/
// directory in a single, stable layout the app can auto-detect — no manually typed build paths.
def researchRuntimeDir = rootProject.layout.buildDirectory.dir('research-runtime')

task researchRuntimeDist(type: Sync) {
    group = 'build'
    description = 'Assemble the research runtime distribution (agent jar, sidecar jar, lib/).'
    dependsOn ':research-agent-runtime:researchAgentJar'
    dependsOn ':browser-mcp-server-java21:sidecarJar'
    dependsOn ':browser-mcp-server-java21:sidecarJar', ':browser-mcp-server-java21:sidecarLibs'
    into researchRuntimeDir
    // Closures defer the cross-project task lookups to execution time (configuration order safe).
    from({ project(':research-agent-runtime').tasks.getByName('researchAgentJar').archiveFile }) {
        rename { 'research-agent-runtime.jar' }
    }
    from({ project(':browser-mcp-server-java21').tasks.getByName('sidecarJar').archiveFile }) {
        rename { 'browser-mcp-sidecar.jar' }
    }
    from({ project(':browser-mcp-server-java21').tasks.getByName('sidecarLibs').destinationDir }) {
        into 'lib'
    }
}

// The LOCAL MODEL RUNTIME distribution (R0): the sidecar thin jar + lib/ in one stable
// layout the app auto-detects — like the research runtime, never packed into the fat jar.
def localRuntimeDir = rootProject.layout.buildDirectory.dir('local-runtime')

task localRuntimeDist(type: Sync) {
    group = 'build'
    description = 'Assemble the local model runtime distribution (sidecar jar + lib/).'
    dependsOn ':local-model-runtime-sidecar-java21:sidecarJar',
            ':local-model-runtime-sidecar-java21:sidecarLibs'
    into localRuntimeDir
    from({ project(':local-model-runtime-sidecar-java21').tasks.getByName('sidecarJar').archiveFile }) {
        rename { 'local-model-runtime-sidecar.jar' }
    }
    from({ project(':local-model-runtime-sidecar-java21').tasks.getByName('sidecarLibs').destinationDir }) {
        into 'lib'
    }
}

// The local model runtime (DirectML engine sidecar) is CORE APP functionality, not a plugin concern:
// the plain `run` stages it exactly like runWithDevPlugins. The whole build runs on the Java 21
// toolchain, so the sidecar launcher is simply that toolchain's java.
def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}.get()
run {
    dependsOn localRuntimeDist
    // UTF-8 as the JVM default (Java 18+ defaults to UTF-8, it stays explicit anyway): every library
    // that decodes HTTP/JSON bytes with the platform default then reads UTF-8 as mojibake
    // ('ä' -> 'ÃÂ¤' after two hops through the MCP chain). All three processes
    // (app, agent, browser sidecar) run UTF-8 explicitly.
    jvmArgs '-Dfile.encoding=UTF-8'
    doFirst {
        systemProperty 'askai.local.runtime.dir', localRuntimeDir.get().asFile.absolutePath
        systemProperty 'askai.local.runtime.java', java21Launcher.executablePath.asFile.absolutePath
    }
}

// Same runtime classpath, main class and (default) JVM options as the regular `run`, but pointed at a
// FRESH IMMUTABLE plugin generation (D1) so the externally-built research plugin is discovered by PF4J at
// runtime WITHOUT any risk that a concurrent/subsequent Gradle build overwrites the classes this process
// still loads lazily. It depends on pluginDistribution (the immutable assembled source) rather than
// installDevPlugin (which mutates the shared dev-plugins dir in place).
task runWithDevPlugins(type: JavaExec) {
    group = 'application'
    description = 'Run AskAI from a fresh immutable plugin generation under <root>/build/dev-plugin-runs.'
    dependsOn ':research-agent-ui-plugin:pluginDistribution'
    dependsOn researchRuntimeDist
    dependsOn localRuntimeDist
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    jvmArgs '-Dfile.encoding=UTF-8' // see `run`: UTF-8 default on every process of the chain
    doFirst {
        // The assembled, immutable plugin directory (…/plugin-dist/research-agent-ui-plugin).
        def pluginDistDir = project(':research-agent-ui-plugin')
                .tasks.getByName('pluginDistribution').destinationDir
        def runsRoot = devPluginRunsDir.get().asFile
        runsRoot.mkdirs()

        // A unique generation per invocation. currentTimeMillis is monotonic enough for run isolation and
        // gives a stable, sortable id; concurrent runs get distinct ids and thus distinct directories.
        def generation = String.valueOf(System.currentTimeMillis())
        def genRoot = new File(runsRoot, generation)
        def genPluginDir = new File(genRoot, pluginDistDir.name)
        // Snapshot the assembled plugin into this generation. From here on NO build task touches it: the
        // next build stages a NEW generation elsewhere, leaving this one frozen for the JVM's lifetime.
        ant.copy(todir: genPluginDir.absolutePath, overwrite: true, force: true) {
            fileset(dir: pluginDistDir.absolutePath)
        }

        // The lock file lives at the GENERATION ROOT (not inside the plugin dir), so PF4J — which only
        // treats sub-directories / jars as plugins — ignores it. The launched JVM holds an exclusive lock
        // on it for its whole lifetime; cleanup below uses it to prove a generation is no longer in use.
        def lockFile = new File(genRoot, '.run.lock')
        lockFile.createNewFile()

        systemProperty 'askai.pluginsDir', genRoot.absolutePath
        systemProperty 'askai.devPluginRun.lock', lockFile.absolutePath
        // DOCUMENTED hand-off of the assembled distribution (read by ResearchRuntimeDefaults; the
        // settings themselves stay in the typed, persisted model — this only feeds the defaults).
        systemProperty 'askai.research.runtime.dir', researchRuntimeDir.get().asFile.absolutePath
        // Same hand-off for the local model runtime sidecar (read by the manager defaults).
        systemProperty 'askai.local.runtime.dir', localRuntimeDir.get().asFile.absolutePath
        systemProperty 'askai.local.runtime.java', java21Launcher.executablePath.asFile.absolutePath

        // Prune generations that are GUARANTEED unused: a prior run that has exited releases its OS-level
        // lock, so tryLock on its .run.lock succeeds — only then do we delete. A generation whose JVM is
        // still alive keeps the lock; we leave it completely untouched (never a partial delete). The
        // current generation is skipped outright because its JVM has not started yet.
        runsRoot.listFiles()?.each { File dir ->
            if (!dir.isDirectory() || dir.name == generation) {
                return
            }
            def otherLock = new File(dir, '.run.lock')
            boolean inUse = false
            if (otherLock.exists()) {
                def raf = new java.io.RandomAccessFile(otherLock, 'rw')
                try {
                    def held = raf.channel.tryLock()
                    if (held == null) {
                        inUse = true
                    } else {
                        held.release()
                    }
                } catch (Exception lockBusy) {
                    inUse = true
                } finally {
                    raf.close()
                }
            }
            if (inUse) {
                logger.lifecycle("runWithDevPlugins: keeping in-use plugin generation ${dir.name}")
            } else {
                project.delete(dir)
            }
        }
    }
}

task verifyFatJarExclusions {
    group = 'verification'
    description = 'Fail if the AskAI fat jar contains research PLUGIN classes, a research extensions.idx or a nested plugin JAR.'
    dependsOn fatJar
    doLast {
        def jar = fatJar.archiveFile.get().asFile
        def violations = []
        // The guard protects PLUGIN isolation. Shared ANALYSIS libraries are host-legal by
        // design: the TTS batch synthesis deliberately shares the ONE sentence segmentation
        // (research-text-opennlp, commit 140f2385), which brings the pipeline/domain cores
        // along via their api dependencies. Everything else under research/ stays forbidden.
        def allowedSharedLibraries = [
                'com/aresstack/askai/research/text/',
                'com/aresstack/askai/research/knowledge/',
                'com/aresstack/askai/research/domain/']
        def zip = new java.util.zip.ZipFile(jar)
        try {
            zip.entries().each { entry ->
                def name = entry.name
                if (name.endsWith('.class')
                        && name.startsWith('com/aresstack/askai/research/')
                        && !allowedSharedLibraries.any { name.startsWith(it) }) {
                    violations << "research plugin class: ${name}"
                }
                if (name.endsWith('.jar') && name.contains('research-agent-ui-plugin')) {
                    violations << "nested plugin jar: ${name}"
                }
                if (name == 'META-INF/extensions.idx') {
                    def content = zip.getInputStream(entry).getText('UTF-8')
                    if (content.contains('com.aresstack.askai.research')) {
                        violations << "research extensions.idx entry"
                    }
                }
            }
        } finally {
            zip.close()
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Fat jar leaks research plugin content:\n  " + violations.join('\n  '))
        }
        logger.lifecycle("Fat jar exclusion check passed: no research classes / extensions.idx / nested plugin jar.")
    }
}

check.dependsOn verifyFatJarExclusions
